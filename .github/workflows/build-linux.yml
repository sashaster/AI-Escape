name: Build Linux
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache build dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: ${{runner.os}}-${{hashFiles('CMakeLists.txt')}}
      - name: Install dependencies
        run: sudo apt install -y --no-install-recommends pkg-config libgl1-mesa-dev libegl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.x'
      - name: Show versions
        run: |
          g++ --version
          cmake --version
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release








